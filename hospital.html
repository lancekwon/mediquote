<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>의료기기 정보 시스템</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.2.0/dist/tabler-icons.min.css">
  <style>
    /* 레퍼런스(관리 콘솔) 톤: Pretendard 한 가지 · 22px 제목 · 회색 머리줄 표 · 촘촘한 행 */
    :root {
      --text: #191f28; --text2: #4e5968; --text3: #8b95a1; --label: #6b7684;
      --line: #e5e8eb; --line2: #f2f4f6; --bg2: #f9fafb;
      --blue: #3182f6; --blue-d: #1b64da; --blue-l: #e8f3ff;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; } /* 목록 길이에 따라 스크롤바가 생겼다 없어지며 화면이 좌우로 밀리는 것 방지 */
    body { margin: 0; background: #fff; color: var(--text); font-size: 14px; line-height: 1.5; letter-spacing: -0.2px; -webkit-font-smoothing: antialiased;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif; }
    button, input, select, textarea { font-family: inherit; letter-spacing: inherit; color: inherit; }
    button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
    a { color: inherit; }
    h1, h2, p { margin: 0; }

    .t1 { font-size: 14px; font-weight: 500; color: var(--text); }
    .t2 { font-size: 13px; color: var(--text2); }
    .t3 { font-size: 12px; color: var(--text3); font-weight: 400; }
    .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wrap { white-space: normal; word-break: keep-all; }
    .num { text-align: right; }
    .center { text-align: center; justify-self: center; }
    .show-sm { display: none; }

    /* 상단 */
    .topbar { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
    .topbar-in { max-width: 1040px; margin: 0 auto; padding: 0 28px; height: 56px; display: flex; align-items: center; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; min-width: 0; }
    .brand-hosp { font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .rep { font-size: 13px; color: var(--text2); white-space: nowrap; }
    .rep b { color: var(--text); font-weight: 600; }
    .rep-phone { margin-left: 8px; color: var(--text2); }
    .icon-btn { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--text2); }
    .icon-btn:hover { background: var(--bg2); }
    .menu { max-width: 1040px; margin: 0 auto; padding: 0 20px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .menu::-webkit-scrollbar { display: none; }
    .nav-tab { padding: 10px 8px 11px; margin: 0 6px; font-size: 14px; font-weight: 500; color: var(--label); white-space: nowrap; border-bottom: 2px solid transparent; }
    .nav-tab:hover { color: var(--text); }
    .nav-tab.active { color: var(--blue); font-weight: 700; border-bottom-color: var(--blue); }

    /* 페이지 */
    .page { max-width: 1040px; margin: 0 auto; padding: 32px 28px 56px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .title { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.35; word-break: keep-all; }
    .desc { font-size: 13px; color: var(--label); margin-top: 6px; line-height: 1.6; word-break: keep-all; }
    .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 32px 0 12px; }
    .sec-title { font-size: 15px; font-weight: 700; }
    .head-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .back { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; color: var(--label); margin-bottom: 12px; }
    .back:hover { color: var(--text); }
    .link { font-size: 13px; color: var(--blue); font-weight: 600; }
    .box { background: #fff; border: 1px solid var(--line); border-radius: 8px; }
    .empty { padding: 32px 16px; text-align: center; font-size: 13px; color: var(--text3); }

    /* 버튼·입력 */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .btn.primary { background: var(--blue); color: #fff; }
    .btn.primary:hover { background: var(--blue-d); }
    .btn.primary:disabled { background: #c9cfd6; cursor: not-allowed; }
    .btn.secondary { background: var(--line2); color: var(--text2); }
    .btn.secondary:hover { background: var(--line); }
    .btn.sm { height: 32px; padding: 0 12px; font-size: 12px; }
    .btn.block { width: 100%; height: 44px; font-size: 14px; }
    .input { width: 100%; height: 40px; padding: 0 12px; font-size: 14px; border: 1px solid var(--line); border-radius: 6px; background: #fff; outline: none; }
    textarea.input { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.6; }
    .input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(49,130,246,0.12); }
    .label { display: block; font-size: 13px; font-weight: 600; color: #333d4b; margin-bottom: 6px; }
    .req { color: #f04452; }
    .form { padding: 20px; }
    .field + .field { margin-top: 16px; }
    .form-actions { display: flex; justify-content: flex-end; margin-top: 20px; }
    .alert { font-size: 13px; padding: 10px 12px; border-radius: 6px; margin-top: 12px; }
    .alert.danger { background: #ffeeee; color: #e42939; }
    .alert.ok { background: #e9f8f1; color: #0a8a55; }
    .notice { width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px 14px; margin-top: 8px; background: #fff8ec; border: 1px solid #ffe4bd; border-radius: 8px; font-size: 13px; color: #c46200; text-align: left; }

    /* 칩·탭 */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .chip { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: 13px; color: var(--text2); white-space: nowrap; }
    .chip:hover { background: var(--bg2); }
    .chip.on { background: var(--blue-l); border-color: #c4dcfd; color: var(--blue-d); font-weight: 600; }
    .chip-n { font-size: 12px; opacity: 0.7; margin-left: 2px; }
    .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--line2); border-radius: 8px; margin-bottom: 16px; max-width: 100%; overflow-x: auto; }
    .seg button { height: 32px; padding: 0 12px; border-radius: 6px; font-size: 13px; color: var(--label); white-space: nowrap; }
    .seg button.on { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .toolbar { margin-bottom: 12px; }
    .search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; max-width: 360px; }
    .search:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(49,130,246,0.12); }
    .search input { flex: 1; min-width: 0; border: 0; outline: none; font-size: 14px; background: none; }

    /* 홈 */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; background: #fff; text-align: left; }
    .stat:hover { border-color: #c9cfd6; }
    .stat-label { font-size: 13px; color: var(--label); }
    .stat-value { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }
    .banner { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
    .banner img { width: 100%; height: auto; }
    .dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 99px; background: rgba(255,255,255,0.9); box-shadow: 0 0 0 1px rgba(0,0,0,0.15); cursor: pointer; transition: all .25s; }
    .dot.on { width: 18px; background: var(--blue); }
    .grid-recent { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .eq-card { padding: 14px; text-align: left; display: block; width: 100%; }
    .eq-card:hover { border-color: #c9cfd6; }
    .eq-img { height: 88px; background: var(--bg2); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 8px; margin-bottom: 10px; }
    .eq-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .eq-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 표 */
    .table { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
    .tr { display: grid; align-items: center; gap: 12px; width: 100%; padding: 10px 16px; min-height: 52px; border-top: 1px solid var(--line2); background: #fff; text-align: left; }
    .tr.th { background: var(--bg2); border-top: 0; min-height: 40px; padding: 9px 16px; font-size: 12px; font-weight: 600; color: var(--label); }
    .tr.clickable:hover { background: var(--bg2); }
    .tr.picked { background: #f5f9ff; }
    .eq-cols { grid-template-columns: minmax(0, 1fr) 150px 130px 56px 96px 112px; }
    .hist-cols { grid-template-columns: 104px 170px minmax(0, 1fr); }
    .svc-cols { grid-template-columns: 96px minmax(0, 1fr) 120px 96px; }
    .ro-cols { grid-template-columns: minmax(0, 1fr) 110px 120px; }
    .ord-cols { grid-template-columns: 96px minmax(0, 1fr) 96px; }
    .doc-cols { grid-template-columns: 96px minmax(0, 1fr) 160px; }
    .cell-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .tfoot { display: block; width: 100%; padding: 10px 16px; background: var(--bg2); border-top: 1px solid var(--line2); font-size: 12px; color: var(--label); }
    .tfoot.more { text-align: center; color: var(--blue); font-size: 13px; font-weight: 600; }
    .thumb { border-radius: 6px; background: var(--bg2); border: 1px solid var(--line2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .badge { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .tag { font-size: 11px; color: var(--blue-d); background: var(--blue-l); padding: 1px 5px; border-radius: 4px; margin-left: 6px; font-weight: 600; vertical-align: 1px; }
    .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    .stepper button { width: 30px; height: 30px; font-size: 15px; color: var(--text2); text-align: center; }
    .stepper button:hover { background: var(--bg2); }
    .stepper span { min-width: 28px; text-align: center; font-size: 13px; font-weight: 600; }
    .stepper button:disabled { color: var(--line); cursor: default; background: none; }
    .toolbar { display: flex; gap: 8px; align-items: center; }
    .toolbar .search { flex: 1; min-width: 0; }
    .loc-select { width: auto; min-width: 150px; max-width: 220px; }
    .loc-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .loc-row:first-child { margin-top: 0; }
    .loc-row .input { flex: 1; min-width: 0; max-width: 420px; }
    .loc-row .icon-btn { flex-shrink: 0; background: #fff; }
    .loc-foot { display: flex; align-items: center; gap: 12px; margin-top: 10px; min-height: 20px; font-size: 13px; }

    /* 장비 상세 */
    .detail { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
    .detail-img { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 20px; }
    .detail-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .kv { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .kv-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); border-top: 1px solid var(--line2); }
    .kv-row:first-child { border-top: 0; }
    .kv-label { background: var(--bg2); padding: 11px 14px; font-size: 13px; color: var(--label); font-weight: 500; }
    .kv-value { padding: 11px 14px; font-size: 14px; display: flex; align-items: center; min-width: 0; word-break: keep-all; }

    .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; background: var(--bg2); }
    .gate-brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 700; margin-bottom: 16px; }
    .footer { text-align: center; color: var(--text3); font-size: 12px; padding: 20px 16px 28px; border-top: 1px solid var(--line); }
    .footer a { color: var(--text2); }

    @media (max-width: 640px) {
      .topbar-in { padding: 0 16px; height: 52px; }
      .rep { display: none; }
      .brand-hosp { font-size: 15px; }
      .menu { padding: 0 8px; }
      .nav-tab { margin: 0 4px; }
      .page { padding: 20px 16px 40px; }
      .page-head { flex-direction: column; align-items: stretch; margin-bottom: 20px; }
      .head-actions { display: grid; grid-template-columns: 1fr 1fr; }
      .title { font-size: 20px; }
      .sec-head { margin-top: 28px; }
      .stats { gap: 8px; }
      .stat { padding: 12px; }
      .stat-label { font-size: 12px; }
      .stat-value { font-size: 17px; }
      /* 폰: 5개를 옆으로 밀어서 봄 (2.4개쯤 보여서 더 있다는 게 티 나게) */
      .grid-recent { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 16px; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
      .grid-recent::-webkit-scrollbar { display: none; }
      .grid-recent > .eq-card { flex: 0 0 40%; scroll-snap-align: start; }
      .loc-select { flex: 0 0 auto; min-width: 0; max-width: 40%; }
      .eq-img { height: 72px; }
      .hide-sm { display: none !important; }
      span.show-sm { display: inline; }
      div.show-sm { display: block; }
      .tr { padding: 10px 12px; gap: 10px; }
      .tr.th { padding: 8px 12px; }
      .eq-cols, .ro-cols { grid-template-columns: minmax(0, 1fr) auto; }
      .hist-cols, .doc-cols { grid-template-columns: 82px minmax(0, 1fr); }
      .svc-cols, .ord-cols { grid-template-columns: 76px minmax(0, 1fr) auto; }
      .detail { grid-template-columns: 1fr; }
      .detail-img { aspect-ratio: 4 / 3; }
      .detail-img.noimg { aspect-ratio: auto; height: 120px; }
      .kv-row { grid-template-columns: 100px minmax(0, 1fr); }
      .search { max-width: none; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<!-- 소스: hospital.jsx → npx esbuild hospital.jsx --outfile=hospital.js --loader:.jsx=jsx --minify -->
<script src="/hospital.js"></script>
</body>
</html>
