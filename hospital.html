<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>대원메디칼 — 병원 포털</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.2.0/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #f7f8fa; color: #1a1a1a; font-size: 14px; letter-spacing: -0.2px; -webkit-font-smoothing: antialiased;
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif; }
    a { color: inherit; }
    .serif { font-family: 'Noto Serif KR', serif; letter-spacing: -0.8px; font-weight: 600; }
    .h1 { font-size: 28px; } .h2 { font-size: 26px; } .h3 { font-size: 18px; }
    .cap { font-family: 'Montserrat', 'Pretendard Variable', sans-serif; font-size: 11px; letter-spacing: 2.5px; color: #8a8f97; font-weight: 500; text-transform: uppercase; }
    .muted { font-size: 13px; color: #6a6f77; line-height: 1.6; }
    .sub { font-size: 11px; color: #8a8f97; }
    .link { font-size: 12px; color: #0952b2; cursor: pointer; font-weight: 500; }
    .card { background: white; border: 1px solid #ececef; border-radius: 4px; }
    .empty { padding: 36px 16px; text-align: center; color: #8a8f97; font-size: 13px; }
    .page { max-width: 880px; margin: 0 auto; padding: 36px 28px 48px; }
    .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; gap: 12px; }

    .btn-primary { background: #0952b2; color: white; padding: 12px 22px; border-radius: 2px; font-size: 13px; font-weight: 500; cursor: pointer; border: 0; font-family: inherit; }
    .btn-primary:hover { background: #073f8c; }
    .btn-primary:disabled { background: #9aa0a8; cursor: not-allowed; }
    .btn-secondary { background: white; border: 1px solid #cfd2d8; color: #1a1a1a; padding: 11px 22px; border-radius: 2px; font-size: 13px; cursor: pointer; font-family: inherit; }
    .btn-secondary:hover { background: #f7f8fa; }
    .input { width: 100%; height: 42px; padding: 0 14px; font-size: 14px; border: 1px solid #cfd2d8; border-radius: 2px; background: white; outline: none; font-family: inherit; color: #1a1a1a; }
    textarea.input { height: auto; padding: 10px 14px; resize: vertical; line-height: 1.6; }
    .input:focus { border-color: #0952b2; }
    .label { display: block; font-size: 12px; font-weight: 600; color: #4a4f57; margin-bottom: 6px; }
    .alert-danger { background: #fbeaea; color: #a52828; font-size: 12px; padding: 9px 12px; border-radius: 2px; }
    .alert-ok { background: #e8f4ed; color: #1d6e3b; font-size: 12px; padding: 9px 12px; border-radius: 2px; }
    .notice { padding: 13px 16px; background: #fbf3e0; border: 1px solid #f0dfae; border-radius: 2px; font-size: 12px; color: #8a5a0c; margin-bottom: 24px; cursor: pointer; display: flex; align-items: center; gap: 8px; }

    .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }

    .topbar { background: white; border-bottom: 1px solid #ececef; position: sticky; top: 0; z-index: 10; }
    .topbar-in { max-width: 1100px; margin: 0 auto; padding: 14px 28px 0; display: flex; align-items: center; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; min-width: 0; }
    .brand-mark { width: 32px; height: 32px; border-radius: 2px; background: #0952b2; color: white; font-family: Montserrat, sans-serif; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand-hosp { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .rep { display: flex; align-items: center; gap: 8px; }
    .rep-avatar { width: 30px; height: 30px; border-radius: 50%; background: #e6effb; color: #0952b2; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
    .icon-btn { width: 32px; height: 32px; background: white; border: 1px solid #cfd2d8; border-radius: 2px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: #1a1a1a; }
    .menu { max-width: 1100px; margin: 0 auto; padding: 6px 20px 0; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
    .menu::-webkit-scrollbar { display: none; }
    .nav-tab { padding: 10px 12px; cursor: pointer; font-size: 13px; color: #4a4f57; white-space: nowrap; border-bottom: 2px solid transparent; }
    .nav-tab.active { color: #0952b2; font-weight: 600; border-bottom-color: #0952b2; }
    .nav-tab:hover:not(.active) { color: #0952b2; }

    .banner { position: relative; margin-bottom: 26px; border-radius: 4px; overflow: hidden; background: #fff; border: 1px solid #ececef; }
    .banner img { width: 100%; height: auto; }
    .dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 99px; background: rgba(255,255,255,0.9); box-shadow: 0 0 0 1px rgba(0,0,0,0.18); cursor: pointer; transition: all .25s; }
    .dot.on { width: 22px; background: #0952b2; }

    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid2.tight { gap: 8px; }
    .eq-card { padding: 16px; cursor: pointer; }
    .eq-card:hover { border-color: #cfd2d8; }
    .eq-img { height: 96px; border: 1px solid #ececef; border-radius: 2px; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 8px; background: white; }
    .eq-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .eq-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .state { font-size: 11px; display: flex; align-items: center; gap: 6px; font-weight: 500; }
    .sdot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .detail-img { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 28px; }
    .detail-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .meta-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 13px; border-bottom: 1px solid #ececef; }

    .row { display: flex; align-items: center; gap: 14px; padding: 14px 2px; border-bottom: 1px solid #ececef; cursor: pointer; }
    .row:hover { background: #fafbfc; }
    .row:last-child { border-bottom: 0; }
    .row-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thumb { border-radius: 2px; background: white; border: 1px solid #ececef; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px; }
    .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .badge { font-size: 11px; padding: 5px 10px; border-radius: 2px; font-weight: 500; flex-shrink: 0; white-space: nowrap; }
    .tag { font-size: 10px; color: #0952b2; background: #e6effb; padding: 2px 6px; border-radius: 2px; margin-left: 6px; font-weight: 500; vertical-align: 1px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { background: white; border: 1px solid #ececef; padding: 7px 13px; border-radius: 2px; font-size: 12px; cursor: pointer; color: #4a4f57; }
    .chip:hover { border-color: #cfd2d8; }
    .chip-on { background: #0952b2; border-color: #0952b2; color: white; font-weight: 500; }
    .chip-on:hover { border-color: #0952b2; }
    .stepper { display: flex; align-items: center; border: 1px solid #cfd2d8; border-radius: 2px; flex-shrink: 0; }
    .stepper button { width: 32px; height: 32px; border: 0; background: white; cursor: pointer; font-size: 16px; color: #4a4f57; font-family: inherit; }
    .stepper button:hover { background: #f7f8fa; }
    .stepper span { min-width: 30px; text-align: center; font-size: 13px; font-weight: 600; }

    .footer { text-align: center; color: #8a8f97; font-size: 11px; padding: 20px 16px 32px; border-top: 1px solid #ececef; background: white; }
    .footer a { color: #4a4f57; }

    @media (max-width: 640px) {
      .page { padding: 24px 16px 40px; }
      .topbar-in { padding: 12px 16px 0; }
      .menu { padding: 4px 8px 0; }
      .rep > div:last-child { display: none; }
      .h1 { font-size: 23px; } .h2 { font-size: 21px; }
      .grid3 { grid-template-columns: 1fr 1fr; gap: 10px; }
      .grid3 > :nth-child(3) { display: none; }
      .grid2 { grid-template-columns: 1fr; }
      .grid2.tight { grid-template-columns: 1fr 1fr; }
      .detail-img { aspect-ratio: 4 / 3; }
      .detail-img.noimg { aspect-ratio: auto; height: 140px; padding: 16px; }
      .eq-card { padding: 12px; }
      .eq-img { height: 80px; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<!-- 소스: hospital.jsx → npx esbuild hospital.jsx --outfile=hospital.js --loader:.jsx=jsx --minify -->
<script src="/hospital.js"></script>
</body>
</html>
