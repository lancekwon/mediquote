<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DWmedi — 의료장비 견적 시스템</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #f1f5f9; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 13px; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .tnum { font-variant-numeric: tabular-nums; }
    .tr-excluded td { opacity: 0.38; }
    .tr-excluded td.td-toggle { opacity: 1; }
    .tr-row:hover td { background: #f8fafc !important; }
    .tr-excluded:hover td { background: #fef2f2 !important; }
    @keyframes fadeSlide { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .animate-fs { animation: fadeSlide .15s ease-out; }
    @keyframes toastIn { 0%{opacity:0} 10%{opacity:1} 80%{opacity:1} 100%{opacity:0} }
    .toast-anim { animation: toastIn 3s ease forwards; }
    /* PDF print styles */
    @media print {
      body > #root { display: none !important; }
      #pdf-print-root { display: block !important; }
    }
    #pdf-print-root { display: none; }
  </style>
</head>
<body>
<div id="root" style="height:100vh;display:flex;flex-direction:column;overflow:hidden;"></div>
<div id="pdf-print-root"></div>

<script src="app.js"></script>
</body>
</html>
