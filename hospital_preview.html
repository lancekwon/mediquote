<!DOCTYPE html>

<body>
<div id="root"></div>

  { id: 'mw',     model: 'IS-300 (장방향)',       maker: 'Insung Medical',   category: 'MicroWave',     purchase: '2026.06', location: '물리치료실', status: '신규 도입',         sk: 'info',    price: 1540000 },

  { id: 'us',     model: 'XC-50',                maker: 'Alpinion',         category: '초음파',         purchase: '2026.06', location: '진료실',     status: '정상 가동',         sk: 'success', price: 16500000 },

function TopHeader({ page, onNav }) {
  const MENU = [
    { key: 'home', label: '홈' },
    { key: 'equipment', label: '장비' },

    { key: 'docs', label: '문서함' },
  ];

    <div style={{background: 'white', borderBottom: '1px solid #ececef', position: 'sticky', top: 0, zIndex: 10}}>

}

function Home({ onOpenList, onOpenDetail }) {
  const BANNERS = [
    { img: '/img/banner/banner_1_newmyo.png', alt: 'NEWMYO III · 3 IN 1 의료용 조합자극기' },

  ];
  const [bannerIdx, setBannerIdx] = useState(0);
  React.useEffect(() => {
    const t = setInterval(() => setBannerIdx(i => (i + 1) % BANNERS.length), 5000);
    return () => clearInterval(t);
  }, []);
  return (
    <div style={{maxWidth: 880, margin: '0 auto', padding: '36px 28px'}}>
      <div style={{marginBottom: 28}}>
        <div className="cap">2026.06.29 · Monday</div>

      </div>

      <div style={{position: 'relative', marginBottom: 28, borderRadius: 4, overflow: 'hidden', background: '#fff', border: '1px solid #ececef'}}>

              cursor: 'pointer', transition: 'all .25s', pointerEvents: 'auto'
            }} />
          ))}
        </div>
      </div>

      <div style={{display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 14}}>
        <div className="cap">My equipment</div>
        <div onClick={onOpenList} style={{fontSize: 12, color: '#0952b2', cursor: 'pointer', fontWeight: 500}}>22대 전체 보기</div>
      </div>
      <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14, marginBottom: 28}}>
        {EQUIPMENT.slice(0, 3).map(eq => {
          const s = STATUS[eq.sk];
          return (
            <div key={eq.id} className="card" style={{padding: 16, cursor: 'pointer'}} onClick={() => onOpenDetail(eq.id)}>
              <div style={{height: 84, background: '#f7f8fa', border: '1px solid #ececef', borderRadius: 2, marginBottom: 14}}></div>
              <div style={{fontSize: 13, fontWeight: 600}}>{eq.model}</div>
              <div style={{fontSize: 11, color: '#8a8f97', margin: '3px 0 10px'}}>{eq.category} · {eq.location}</div>
              <div style={{fontSize: 11, color: s.text, display: 'flex', alignItems: 'center', gap: 6, fontWeight: 500}}><span style={{width: 6, height: 6, borderRadius: '50%', background: s.dot}}/>{eq.status}</div>

      <div className="card" style={{padding: '20px 22px', marginBottom: 28}}>
        <div style={{display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 14}}>

          {[['CO2 gas 20kg', '×1'], ['멸균포', '×5'], ['ESWT 젤', '×3'], ['사각베개', '×2']].map(([n, q], i) => (
            <span key={i} style={{background: 'white', border: '1px solid #ececef', padding: '8px 14px', borderRadius: 2, fontSize: 12, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6}}>

      <div style={{display: 'flex', gap: 8, marginBottom: 16, alignItems: 'center'}}>

function EquipmentDetail({ id, onBack }) {
  const eq = EQUIPMENT.find(e => e.id === id) || EQUIPMENT[0];

  const TLINE = (eq.id === 'xray') ? [
    { date: '2026.04.20', t: '견적 발송', d: 'DW-2026-042 (1차)', dot: '#2a8a4f' },

    { date: '2026.06.18', t: '납품 · 설치 완료', d: '엔지니어 박진수 · 교육 2시간', dot: '#2a8a4f' },
    { date: '2026.08.15 예정', t: '방사선 안전관리 검사 (D-45)', d: '신설 X-Ray 의무 검사', dot: '#b07911' },
  ] : [
    { date: '2026.06.11', t: '계약 체결', d: 'DW-2026-042-R3 · ' + (eq.price || 0).toLocaleString() + '원', dot: '#2a8a4f' },
    { date: '2026.06.18', t: '납품 · 설치 완료', d: '엔지니어 박진수', dot: '#2a8a4f' },
    { date: '2026.06.20', t: '사용 교육 완료', d: '담당자 1명 · 1시간', dot: '#2a8a4f' },
  ];

  const META = (eq.id === 'xray') ? [

    ['계약번호', 'DW-2026-042-R3'],
    ['보증기간', '~2028.06.11 (D+715)'],
    ['다음 검사', '2026.08.15 (D-45)'],

  return (
    <div style={{maxWidth: 880, margin: '0 auto', padding: '36px 28px'}}>

      <div style={{marginBottom: 24}}>

        <div style={{fontSize: 12, color: '#6a6f77', marginTop: 10}}>시리얼 SN-{eq.id.toUpperCase()}-26K11-0042 · {eq.location}</div>

      <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 22}}>

        <div className="card" style={{padding: '18px 20px'}}>
          <div className="cap" style={{marginBottom: 6}}>Status</div>
          <div style={{display: 'flex', alignItems: 'center', gap: 7, marginBottom: 16}}>

      <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginBottom: 32}}>

        <button className="btn-secondary" style={{padding: '12px 16px'}}>소모품 주문</button>

          <div key={i} className="card" style={{padding: '18px 20px', cursor: 'pointer'}}>
            <div style={{fontSize: 13, fontWeight: 600}}>{d.t}</div>
            <div style={{fontSize: 11, color: '#8a8f97', marginTop: 5}}>{d.d}</div>

      <div className="card" style={{padding: '20px 22px', marginBottom: 32}}>
        {TLINE.map((t, i) => (
          <div key={i} style={{display: 'flex', gap: 16}}>
            <div style={{width: 12, flexShrink: 0, display: 'flex', flexDirection: 'column', alignItems: 'center'}}>
              <div style={{width: 9, height: 9, borderRadius: '50%', background: t.dot, marginTop: 5}}/>
              {i < TLINE.length - 1 && <div style={{width: 1, flex: 1, background: '#ececef', marginTop: 5}}/>}
            </div>
            <div style={{flex: 1, paddingBottom: i === TLINE.length - 1 ? 0 : 18}}>
              <div className="cap" style={{fontSize: 10, letterSpacing: 1.5}}>{t.date}</div>
              <div style={{fontSize: 13, fontWeight: 600, marginTop: 4}}>{t.t}</div>
              {t.d && <div style={{fontSize: 12, color: '#6a6f77', marginTop: 3}}>{t.d}</div>}
            </div>
          </div>
        ))}
      </div>

      <div style={{marginBottom: 12}}>
        <div className="cap">Next steps</div>
        <div className="serif" style={{fontSize: 18, fontWeight: 600, marginTop: 4}}>이 장비의 다음 단계</div>
      </div>

      <div className="card" style={{padding: '28px 30px', marginBottom: 12}}>
        <div className="cap" style={{color: '#0952b2'}}>Line-up extension</div>
        <div className="serif" style={{fontSize: 24, fontWeight: 600, lineHeight: 1.25, margin: '10px 0 20px'}}>영상 라인업을, 한 단계 더 확장해드립니다.</div>
        <div style={{display: 'grid', gridTemplateColumns: '110px 1fr', gap: 18, marginBottom: 18}}>
          <div style={{background: '#f7f8fa', border: '1px solid #ececef', borderRadius: 2, aspectRatio: '1/1'}}></div>
          <div>
            <div style={{fontSize: 14, fontWeight: 600}}>GEMSS C-arm 9300</div>
            <div style={{fontSize: 11, color: '#8a8f97', margin: '3px 0 10px'}}>이동형 영상장비 · 정형외과 시술 최적화</div>
            <ul style={{fontSize: 12, color: '#4a4f57', lineHeight: 1.85, margin: 0, paddingLeft: 18}}>
              <li>수술실 / 시술실 이동 사용</li>
              <li>9인치 인텐시파이어 · 고해상도</li>
              <li>현재 XVISION-525 PACS와 연동 가능</li>
            </ul>
          </div>
        </div>
        <div style={{background: '#e6effb', border: '1px solid #c7d8f0', borderRadius: 2, padding: '13px 16px', marginBottom: 18, fontSize: 12, color: '#0952b2', lineHeight: 1.7}}>
          이번 견적에서 제외된 <b style={{fontWeight: 600}}>C-arm</b>은 정형외과 시술실 영상 라인업의 자연스러운 보완 장비입니다.
        </div>
        <div style={{display: 'flex', gap: 8}}>
          <button className="btn-primary">맞춤 견적 받기</button>
          <button className="btn-secondary">라인업 비교 보기</button>
        </div>
      </div>

      <div className="card" style={{padding: '22px 24px', display: 'flex', alignItems: 'center', gap: 18}}>
        <div style={{flex: 1, minWidth: 0}}>
          <div className="cap" style={{marginBottom: 4}}>Resell</div>
          <div style={{fontSize: 14, fontWeight: 600}}>사용하시던 장비, 새 주인을 찾아드립니다.</div>
          <div style={{fontSize: 12, color: '#6a6f77', marginTop: 6, lineHeight: 1.7}}>보유 1년 이상 장비부터 처분 안내드리고 있습니다. 같은 모델 평균 시세 <b style={{color: '#1a1a1a', fontWeight: 600}}>850~1,200만원</b> · 최근 90일 거래 7건</div>
        </div>
        <button className="btn-secondary">시세 확인하기</button>
      </div>
    </div>
  );
}

function Placeholder({ title, desc, eng }) {
  return (
    <div style={{maxWidth: 880, margin: '0 auto', padding: '100px 28px', textAlign: 'center'}}>
      <div className="cap">{eng}</div>
      <div className="serif" style={{fontSize: 28, fontWeight: 600, marginTop: 10}}>{title}</div>
      <div style={{fontSize: 13, color: '#6a6f77', marginTop: 10}}>{desc}</div>
      <div className="cap" style={{marginTop: 30}}>Coming soon</div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState('home');
  const [selectedId, setSelectedId] = useState(null);

  const openDetail = (id) => { setSelectedId(id); setPage('detail'); };
  const nav = (p) => { setPage(p); };

  return (
    <div>
      <TopHeader page={page} onNav={nav} />
      {page === 'home' && <Home onOpenList={() => setPage('equipment')} onOpenDetail={openDetail} />}
      {page === 'equipment' && <EquipmentList onSelect={openDetail} />}
      {page === 'detail' && <EquipmentDetail id={selectedId} onBack={() => setPage('equipment')} />}
      {page === 'consumables' && <Placeholder eng="Consumables" title="소모품 주문" desc="자주 사용하시는 품목을 한 번에 주문하실 수 있습니다." />}
      {page === 'service' && <Placeholder eng="Service" title="점검·수리" desc="정기검사와 A/S 신청을 한 곳에서 안내해드립니다." />}
      {page === 'docs' && <Placeholder eng="Documents" title="문서함" desc="견적서·세금계산서·검사 보고서를 한 곳에 보관해드립니다." />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
